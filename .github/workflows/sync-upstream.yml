name: Sync fork with upstream release

# GitHub can't fire a webhook into this fork when the upstream repo
# publishes a release, so this polls upstream on a schedule: fast-forwards
# main, mirrors recent release tags, and mirrors Release entries (title +
# notes). Tag pushes are scoped to recent releases only (not `--tags`),
# since brand-new tag refs are pushed as their whole tree from scratch and
# some ancient upstream tags contain workflow files GITHUB_TOKEN can't
# push without the `workflow` OAuth scope, which it doesn't have.

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

env:
  UPSTREAM_REPO: kildahldev/unofficial-polestar-api

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ericyew/unofficial-polestar-api'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags

      - name: Fast-forward main to upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --ff-only upstream/main
          git push origin main

      - name: Fetch recent upstream releases
        run: |
          curl -sf "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=1" \
            | jq -c '[.[] | select(.draft==false)] | sort_by(.created_at) | .[]' \
            > /tmp/upstream-releases.jsonl

      - name: Push recent release tags
        run: |
          while IFS= read -r rel; do
            tag=$(jq -r '.tag_name' <<<"$rel")
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              git push origin "refs/tags/$tag"
            else
              echo "Tag $tag not fetched from upstream, skipping"
            fi
          done < /tmp/upstream-releases.jsonl

      - name: Mirror missing GitHub Release entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r rel; do
            tag=$(jq -r '.tag_name' <<<"$rel")
            title=$(jq -r '.name // .tag_name' <<<"$rel")
            prerelease=$(jq -r '.prerelease' <<<"$rel")
            jq -r '.body // ""' <<<"$rel" > /tmp/notes.md

            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              continue
            fi
            if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag not fetched from upstream, skipping"
              continue
            fi

            args=(--repo "${{ github.repository }}" --title "$title" --notes-file /tmp/notes.md)
            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            fi
            echo "Creating release $tag"
            gh release create "$tag" "${args[@]}"
          done < /tmp/upstream-releases.jsonl
